name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for the workflow token. Nothing here writes to the repo.
permissions:
  contents: read

jobs:
  # ubuntu-latest is 24.04, which dropped libwebkit2gtk-4.0-dev. Tauri v1 needs
  # 4.0, so the build runs in a 22.04 container where it is still available,
  # regardless of what the host image becomes.
  rust:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      # The container is bare and actions/checkout needs git, so this runs
      # first. Everything is root here, so no sudo.
      - name: Install base tooling
        run: |
          apt-get update
          apt-get install -y curl wget file git ca-certificates build-essential pkg-config \
            cmake clang libclang-dev

      - name: Install Tauri system dependencies
        run: |
          apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev
          # No protobuf-compiler: src-tauri/build.rs uses protoc-bin-vendored.

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Registry and git checkouts only: a debug test target/ is several GB,
      # too big to be worth saving and restoring against the 10 GB repo limit.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-test-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-test-

      # src-tauri/src/auth.rs uses the hard env!() macro, so with no .env.local
      # the crate does not compile at all. .env.test holds local-stack values.
      - name: Provide compile-time env
        run: cp .env.test .env.local

      # The inference contract tests run here too but skip, because their
      # models are not fetched; the inference job below requires them.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --workspace --all-targets

      # A hosted runner has ~14 GB free; this shows how close the build came.
      - name: Disk usage
        if: always()
        run: df -h / && du -sh src-tauri/target || true

  # The model logic on its own: crates/nodea-inference against real GGUFs, with
  # no Tauri, webkit or .env.local. See notes/llama-cpp-4-migration.md §8.
  inference:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Install base tooling
        run: |
          apt-get update
          apt-get install -y build-essential cmake clang libclang-dev git curl ca-certificates pkg-config libssl-dev

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-inference-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-inference-

      # About 1.5 GB for all four models. The key is the manifest, so a
      # change to a pinned model refetches.
      - uses: actions/cache@v4
        with:
          path: .cache/test-models
          key: test-models-${{ hashFiles('src-tauri/crates/nodea-inference/tests/models.toml') }}

      - name: Fetch test models
        working-directory: src-tauri
        run: cargo run -p nodea-inference --bin fetch-test-models

      - name: cargo test -p nodea-inference
        working-directory: src-tauri
        env:
          NODEA_REQUIRE_TEST_MODELS: '1'
        run: cargo test -p nodea-inference

      - name: Disk usage
        if: always()
        run: df -h / && du -sh src-tauri/target .cache/test-models || true

  # Metal compiled in. Hosted macOS runners are VMs with a paravirtual GPU,
  # so the fixtures load with n_gpu_layers = 0: this proves the Metal build
  # compiles and links (shaders embedded) and that the suite passes on macOS.
  # Metal inference itself is the manual release check.
  inference-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-inference-macos-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-inference-macos-

      - uses: actions/cache@v4
        with:
          path: .cache/test-models
          key: test-models-${{ hashFiles('src-tauri/crates/nodea-inference/tests/models.toml') }}

      - name: Fetch test models
        working-directory: src-tauri
        run: cargo run -p nodea-inference --bin fetch-test-models

      - name: cargo test -p nodea-inference --features metal
        working-directory: src-tauri
        env:
          NODEA_REQUIRE_TEST_MODELS: '1'
        run: cargo test -p nodea-inference --features metal

  # The Vulkan builds the release ships for Linux and Windows. The release
  # workflow only runs from main, so without these a broken Vulkan build would
  # first show up when cutting a release. Runners have no GPU: Linux uses
  # Mesa's software Vulkan device (lavapipe) to run one generation through the
  # Vulkan backend, and both run the CPU path of a Vulkan build, which is what
  # a user without a usable GPU gets.
  inference-vulkan-linux:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Install base tooling and the Vulkan SDK
        run: |
          apt-get update
          apt-get install -y build-essential cmake clang libclang-dev git curl wget gnupg \
            ca-certificates pkg-config libssl-dev mesa-vulkan-drivers
          # LunarG's jammy packages: glslc, headers and SPIRV-Headers, which
          # 22.04's own packages are too old to provide.
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | gpg --dearmor -o /usr/share/keyrings/lunarg.gpg
          echo "deb [signed-by=/usr/share/keyrings/lunarg.gpg] https://packages.lunarg.com/vulkan jammy main" \
            > /etc/apt/sources.list.d/lunarg-vulkan-jammy.list
          apt-get update
          apt-get install -y vulkan-sdk

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-inference-vulkan-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-inference-vulkan-

      - uses: actions/cache@v4
        with:
          path: .cache/test-models
          key: test-models-${{ hashFiles('src-tauri/crates/nodea-inference/tests/models.toml') }}

      - name: Fetch test models
        working-directory: src-tauri
        run: cargo run -p nodea-inference --features vulkan --bin fetch-test-models

      - name: cargo test -p nodea-inference --features vulkan (CPU path)
        working-directory: src-tauri
        env:
          NODEA_REQUIRE_TEST_MODELS: '1'
        run: cargo test -p nodea-inference --features vulkan

      - name: One generation on the Vulkan backend (lavapipe)
        working-directory: src-tauri
        env:
          NODEA_LLAMA_LOG: '1'
        run: |
          cargo run -p nodea-inference --features vulkan --bin nodea-infer -- \
            --model smoke --prompt "Say hello." --gpu-layers 99 --format pretty --bench 2>&1 \
            | tee infer.log
          grep -q "offloaded" infer.log
          grep -q "finish_reason" infer.log

  inference-vulkan-windows:
    runs-on: windows-latest
    env:
      VULKAN_VERSION: 1.4.309.0
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install the Vulkan SDK
        shell: pwsh
        run: |
          curl.exe -sSL -o "$env:RUNNER_TEMP\VulkanSDK.exe" "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/VulkanSDK-$env:VULKAN_VERSION-Installer.exe"
          & "$env:RUNNER_TEMP\VulkanSDK.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$env:VULKAN_VERSION\Bin"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-inference-windows-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-inference-windows-

      - name: Fetch the smoke model
        working-directory: src-tauri
        run: cargo run -p nodea-inference --features vulkan --bin fetch-test-models -- --only smoke

      # Starts, finds no Vulkan GPU on the runner, and generates on the CPU.
      - name: One generation from the Vulkan build
        working-directory: src-tauri
        run: cargo run -p nodea-inference --features vulkan --bin nodea-infer -- --model smoke --prompt "Say hello." --format pretty --bench

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Vite reads .env.local in every mode, which is what supplies the VITE_*
      # values `npm run build` needs.
      - name: Provide build-time env
        run: cp .env.test .env.local

      - run: npx tsc --noEmit

      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # playwright.config.ts loads .env.test itself and starts the dev server.
      # No backend, no database, no Supabase - see tests/README.md.
      - run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # scripts/ is load-bearing for the release workflow (version numbering,
  # version stamping, bundle selection); this is the job that keeps it honest.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pytest

      - run: python -m pytest scripts/tests/ -v

  # THIRD_PARTY_LICENSES.md ships in every bundle. This fails when a dependency
  # change was not followed by scripts/generate-third-party-licenses.sh, or when
  # a new dependency brings a licence outside src-tauri/about.toml's allowlist.
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-about
          key: cargo-about-0.9.2-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-about-0.9.2-

      - name: Install cargo-about
        run: |
          cargo about --version 2>/dev/null | grep -q 0.9.2 \
            || cargo install cargo-about --locked --features cli --version 0.9.2

      - run: ./scripts/generate-third-party-licenses.sh

      - name: THIRD_PARTY_LICENSES.md is up to date
        run: git diff --exit-code THIRD_PARTY_LICENSES.md

  fmt:
    runs-on: ubuntu-latest
    # Neither fmt nor clippy has ever run in CI, so both are expected to be
    # red on the first cut. They are advisory until that backlog is cleared -
    # opening a public repo with a red default branch is worse than a soft gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    continue-on-error: true
    steps:
      - name: Install base tooling
        run: |
          apt-get update
          apt-get install -y curl wget file git ca-certificates build-essential pkg-config \
            cmake clang libclang-dev

      - name: Install Tauri system dependencies
        run: |
          apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-clippy-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-clippy-

      - name: Provide compile-time env
        run: cp .env.test .env.local

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings
