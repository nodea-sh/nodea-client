[package]
name = "ai4all-tauri"
version = "0.1.0"
description = "Nodea Tauri App"
authors = ["GAYOSO LLC"]
license = "Apache-2.0"
repository = "https://github.com/ai4all-io/nodea-client"
edition = "2021"

[lib]
name = "ai4all_tauri"
path = "src/lib.rs"

# The app is the workspace root. Everything model-related lives in
# crates/nodea-inference, which builds and tests without Tauri (see
# notes/llama-cpp-4-migration.md).
[workspace]
members = ["crates/*"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenv = "0.15"

[dependencies]
nodea-proto = { path = "crates/nodea-proto" }
nodea-inference = { path = "crates/nodea-inference" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
# Opens the web console from Settings > Account; scoped in capabilities/.
tauri-plugin-opener = "2"
# On Windows and Linux a nodea:// link starts a second process; this hands it
# to the running app instead (the deep-link feature forwards the URL).
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
# `net` is for TcpListenerStream, used by the gRPC round-trip tests to serve
# a mock backend on an ephemeral port.
tokio-stream = { version = "0.1", features = ["sync", "net"] }
tonic = { version = "0.11", features = ["tls", "tls-webpki-roots"] }
prost = "0.12"
uuid = { version = "1.6", features = ["v4", "serde"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
base64 = "0.21"
sha2 = "0.10"
rand = "0.8"
open = "5.0"
urlencoding = "2.1"
hostname = "0.3"
chrono = "0.4"
futures = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }

# llama.cpp on Apple's GPU. Windows and Linux release builds pass
# `--features vulkan` instead; without it they run on the CPU (dev and CI).
[target.'cfg(target_os = "macos")'.dependencies]
nodea-inference = { path = "crates/nodea-inference", features = ["metal"] }

[dev-dependencies]
tempfile = "3.8"
tokio-test = "0.4"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
# llama.cpp's Vulkan backend: NVIDIA, AMD and Intel GPUs on Windows and Linux.
vulkan = ["nodea-inference/vulkan"]

# Keep debug builds small: line numbers in our crate's backtraces, no
# debuginfo for dependencies, which otherwise grows target/ past what a
# GitHub-hosted runner has free.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
