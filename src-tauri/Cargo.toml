[package]
name = "ai4all-tauri"
version = "0.1.0"
description = "Nodea Tauri App"
authors = ["GAYOSO LLC"]
license = "Apache-2.0"
repository = "https://github.com/ai4all-io/nodea-client"
edition = "2021"

[lib]
name = "ai4all_tauri"
path = "src/lib.rs"

# The app is the workspace root. Everything model-related lives in
# crates/nodea-inference, which builds and tests without Tauri (see
# notes/llama-cpp-4-migration.md).
[workspace]
members = ["crates/*"]

[build-dependencies]
tauri-build = { version = "1.5", features = [] }
dotenv = "0.15"

[dependencies]
nodea-proto = { path = "crates/nodea-proto" }
nodea-inference = { path = "crates/nodea-inference" }
tauri = { version = "1.5", features = ["shell-open", "window-start-dragging", "system-tray"] }
tauri-plugin-deep-link = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
# `net` is for TcpListenerStream, used by the gRPC round-trip tests to serve
# a mock backend on an ephemeral port.
tokio-stream = { version = "0.1", features = ["sync", "net"] }
tonic = { version = "0.11", features = ["tls", "tls-webpki-roots"] }
prost = "0.12"
uuid = { version = "1.6", features = ["v4", "serde"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
base64 = "0.21"
sha2 = "0.10"
rand = "0.8"
open = "5.0"
urlencoding = "2.1"
hostname = "0.3"
chrono = "0.4"
futures = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }

[dev-dependencies]
tempfile = "3.8"
tokio-test = "0.4"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

# mistralrs-metal-compile builds the Metal kernels for mistralrs-core,
# mistralrs-quant and mistralrs-paged-attn. The air -> metallib link can exit 0
# while producing an essentially empty .metallib under a release build's load -
# see vendor/mistralrs-metal-compile-0.9.5 for the verify-and-retry fix. Patch
# sections only take effect in the workspace root, which is this file.
[patch."https://github.com/EricLBuehler/mistral.rs"]
mistralrs-metal-compile = { path = "vendor/mistralrs-metal-compile-0.9.5" }

# Keep debug builds small: line numbers in our crate's backtraces, no
# debuginfo for dependencies. mistralrs/candle debuginfo grows target/ to
# 5-20 GB, more than a GitHub-hosted runner has free.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
