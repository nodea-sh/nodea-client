[package]
name = "mistralrs-metal-compile"
authors = ["Eric Buehler"]
version = "0.9.5"
edition = "2021"
rust-version = "1.94"
description = "Fast, flexible LLM inference."
repository = "https://github.com/EricLBuehler/mistral.rs"
license = "MIT"
homepage = "https://github.com/EricLBuehler/mistral.rs"

[dependencies]
candle-metal-kernels = { git = "https://github.com/huggingface/candle.git", version = "0.11.0", rev = "66a8cf184a5a519671454066b1b9efd446ec9f5c", optional = true }
objc2-metal = { version = "0.3.2", optional = true }

[features]
default = []
metal = ["dep:candle-metal-kernels", "dep:objc2-metal"]
